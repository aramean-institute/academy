<div id="status400" align="center" hide>
  <h1>Error</h1>
  <p>400</p>
  <hr>
</div>
<h1 id="loader" align="center">...</h1>
<section id="success">
  <h1 id="question" marginbottom="2%" class="tac" hide>Which one of these is <span id="word" class="di"
      ondata-bindchange="insertafterbegin:[&quot;];insertbeforeend:[&quot;];insertafterend:[?]" bold></span>
  </h1>
  <form id="quiz" method="get"
    onsubmitted="data-bindpayload:[correct:alternative]"
    onifdata-bindpayload="([{correct}]:[{main}])/show:#footer_correct&storage-localadd:[quiz_{c}]:[correct]:[{main}]?show:#footer_wrong&storage-localadd:[quiz_{c}]:[wrong]:[{main}]"
    onifdata-onfinish="([{main}]:[])/show:#footer_complete&show:#complete&hide:#success&setmax:#progress:[{p}]&setvalue:#progress:[999]"
    class="box cards xs_gtc2 lg_gtc4 br0- bcwhite-"
    bindvar="src"
    bindquery="p:p;c:c"
    bindasset="apikey:api.api_key"
    bindglobal="l:globalize.code"
    data-src="{src}"
    data-header="apikey:{apikey};Accept:application/json+single"
    data-status="400;#status400"
    data-onerror="hide:#success"
    data-loader="#loader"
    data-onempty="show:#empty"
    data-set="total:total;main:main.id;mainword:main.word.eng;cat:c"
    data-onfinish="setmax:#progress:[{total}];show:#question"
    data-iterate="alternatives"
    data-bind="main.word.eng:#word"
    globalize-onsetload="rerun">
    <label data-set="i:id;word:speech_rv.syr" click="responsivevoice--speak:[{word}]" id="l{i}" for="a{i}" padding="5%"
      class="m025 shade1">
      <figure alignitems="center">
        <img padding="1rem" data-set="icon:icon.svgrepo"
          setsrc="https://www.svgrepo.com/show/{icon}.svg" width="70%">
        <h3 data-get="word_transliterated.syr_lat">?</h3>
        <h5 bindglobal="l:globalize.code" data-get="word.syr"></h5>
      </figure>
    </label>
    <input type="radio" data-get="id" data-set="id:id" onselectchange="boxshadow:#l{id}:[gray 0 0 0 1px];enable:#check"
      onunselected="boxshadow:#l{id}:[0 2px 4px rgba(0,0,0, .1)]" name="alternative" id="a{id}" hide>
  </form>
</section>

<section id="complete" hide>
  <img class="m0a" src="https://www.svgrepo.com/show/276751/firework.svg" screen-xxs="width:[60%]" screen-md="width:[40%]" screen-xl="width:[30%]" maxwidth="40rem" maxheight="18.75rem">
  <h1 marginbottom="2%" class="tac">Lesson complete</h1>
</section>

<section id="review" hide>
  <h2 class="tac" marginbottom="1rem" bold>Review</h2>

  <!-- Wrong answers -->
  <h4 margintop="1rem" marginbottom="0.5rem" color="indianred" bold>✗ Wrong</h4>
  <div id="no_wrong" hide>
    <small color="gray">No wrong answers</small>
  </div>
  <div
    bindquery="c:c"
    storage-bind="local:quiz_{c}"
    storage-iterate="wrong"
    storage-onempty="#no_wrong"
    runorder="bindquery;storage-bind;storage-iterate"
    class="box cards xs_gtc2 md_gtc3 lg_gtc4 br0- gap05">
    <div class="shade1 br05 p075 tac" bgcolor="rgba(205,92,92,.1)" border="2px solid indianred">
      <small storage-get="[*]" bold></small>
    </div>
  </div>

  <!-- Correct answers -->
  <h4 margintop="1rem" marginbottom="0.5rem" color="forestgreen" bold>✓ Correct</h4>
  <div id="no_correct" hide>
    <small color="gray">No correct answers</small>
  </div>
  <div
    bindquery="c:c"
    storage-bind="local:quiz_{c}"
    storage-iterate="correct"
    storage-onempty="#no_correct"
    runorder="bindquery;storage-bind;storage-iterate"
    class="box cards xs_gtc2 md_gtc3 lg_gtc4 br0- gap05">
    <div class="shade1 br05 p075 tac" bgcolor="rgba(34,139,34,.1)" border="2px solid forestgreen">
      <small storage-get="[*]" bold></small>
    </div>
  </div>
</section>
