<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="version" content="1.0.0">
  <script src="https://cdn.front.nu/nightly/front.js"
    module="globalize;chronotize;data;navigate;keyboard;animate;canvas;math;audio;storage;screen" var="api;enum"
    plugin="responsivevoice;confetti;progressbar" conf="debug:false;debugLocalhost:true;varsDir:assets/json/vars;storageKey:academy"
    globalize-conf="folder:assets/json/locales" navigate-conf="startpage:/;startpageLocal:academy">
    </script>
  <link type="text/css" href="https://cdn.front.nu/dist/front.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="data:,">
  <title globalize-get>Aramaic Academy</title>
</head>

<body bgcolor="snow">

  <div id="navloader" class="navloader pa t0 w100 bcblack03 h2px" hide>
    <div class="bcblack08"></div>
  </div>
  <header class="df aic" padding="1.2rem 2rem">
    <div flex flexdirection="row" class="aic f1">
      <img radius="50%" boxshadow="-3px 2px 0px black" height="2rem" src="https://www.aramean.institute/favicon.ico">
      <strong color="dimgray" marginleft="0.75rem" lineheight="1.2" letterspacing="0" bindglobal="title:title">{title}</strong>
    </div>
    <select name="language" padding="0 1.25rem" class="br05 shade1" onvaluechange="globalize-set">
      <option selected disabled globalize-get>Change language</option>
      <option value="sv">Svenska</option>
      <option value="en">English (US)</option>
      <option value="arc">𐡀𐡓𐡌𐡉𐡀</option>
      <option value="syc">ܐܪܡܝܐ</option>
      <option value="am">አማርኛ</option>
    </select>
  </header>

  <aside></aside>

  <main>

    <article>
      <section class="df fdc aic jcc" minheight="60vh" relative>

        <!-- Confetti at the top -->
        <div absolute top="0" left="0" class="w100" width="100%" height="50%" confetti--load
          confetti-src="assets/img/arc.gif;assets/img/oar.gif;assets/img/syc.gif;assets/img/syt.gif;assets/img/syh.gif"
          confetti-count="15" confetti-size="20" confetti-direction="up" confetti-fade="true" confetti-speed="1"></div>

        <div padding="2rem 2rem 1rem" flex flexdirection="column" align="center">

          <h1 id="title" lineheight="2" bold letterspacing="-0.5px" globalize-get color="darkbrown"
            textshadow="1px 1px 1px white">Aramaic</h1>

          <div flex flexdirection="column" color="gray" paddingbottom="3rem" fontsize="110%" lineheight="1.6">
            <p globalize-get>Learn the world's oldest living language</p>
            <p globalize-get>— one word at a time.</p>
          </div>

          <!-- CTA buttons -->
          <div flex flexdirection="column" gap="12" alignitems="center">
            <button flex flexdirection="column" href="register.html" bgcolor="red" color="white" radius="1rem"
              class="button shade2" mouseover="color:[yellow]" mouseout="color:[white]" paddingright="3rem"
              paddingleft="3rem" height="2.8rem" fontsize="1.1rem" bold globalize-get uppercase>Let's start</button>
            <a flex flexdirection="row" href="login.html" bgcolor="white" bold radius="1rem" paddingright="1rem"
              paddingleft="1rem" gap="10" height="2.5rem" alignitems="center" fontsize="90%"
              globalize-get="login_existing">I already have an account</a>
          </div>
        </div>

      </section>

    </article>
  </main>

  <aside ontoggle="toggle.class[pf t0 r0 h100p zi50]" class="*_dn"></aside>
  <footer padding="2rem" flex boxshadow="0 2px 4px rgba(0,0,0, .3)" screen-xxs="justifycontent:[center];fontsize:[80%]" screen-lg="justifycontent:[left];fontsize:[100%]">
    <p flex color="gray">© Aramean Institute</p>
  </footer>
</body>

</html>
