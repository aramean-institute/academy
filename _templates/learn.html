<template>
  <header class="topbar h4_5 pr1 shade1">
    <div flex flexdirection="row">
      <img radius="50%" boxshadow="-3px 2px 0px black" height="2rem" src="https://www.aramean.institute/favicon.ico">
      <strong color="dimgray" marginleft="0.75rem" letterspacing="0" bindglobal="title:title">{title}</strong>
    </div>
    <div class="f1" marginleft="1rem">
      <progress progressbar-set id="progress" progressbar--set radius="1rem" onsetmax="setmax:++" class="shade1" color="darkgreen" bgcolor="gainsboro" bindquery="p:p" value="{p:0}"
        max="100"></progress>
    </div>
    <button click="toggle" clicktargetfield="aside[1]" class="md_du light pl1"><i class="icon32">≡</i></button>
    <div class="gap1- fs07 pl1 pr05 md_dn">
      <details class="md_dn">
        <summary globalize="it_products"><i class="icon pr025">🌐</i><span globalize-get>Language</span></summary>
        <ul class="pa r1 bcwhite p05 fdc bs5 p025- fdc" margintop="0.5rem" width="7rem">
          <li><a click="globalize-set:[sv]" class="fs09">Svenska</a></li>
          <li><a click="globalize-set:[en]" class="fs09">English</a></li>
          <li><a click="globalize-set:[arc]" class="fs09">𐡀𐡓𐡌𐡉𐡀</a></li>
          <li><a click="globalize-set:[syc]" class="fs09">ܐܪܡܝܐ</a></li>
          <li><a click="globalize-set:[am]" class="fs09">አማርኛ</a></li>
        </ul>
      </details>
    </div>
  </header>
  <aside></aside>
  <main class="pauto"></main>
  <aside>
    <div include="_includes/sidebar.html"></div>
  </aside>
  <footer inherit="false" class="flc gut2-" boxshadow="0 0 7px rgba(0,0,0, .1)" justifycontent="center" height="5rem" relative>
    <button bindquery="c:c;p:p" setqueryhref="p:++" href="?c={c}&p={p:1}" class="button" radius="1rem" bold
      click="audio-play:[assets/audio/wrong.mp3]" paddingright="2rem" paddingleft="2rem"
      lineheight="2.5rem">Skip</button>
    <button id="check" class="gray" bold radius="1rem" paddingright="2rem" paddingleft="2rem" lineheight="2.5rem"
      click="submit:#quiz:[#quiz]" onenabled="bgcolor:[green];color:[white]" disabled>Check</button>

    <div id="footer_correct" onshow="audio-play:[assets/audio/correct.mp3];disable:*main" bgcolor="forestgreen"
      color="white" class="pa l0 t0" width="100%" height="100%" hide>
      <div class="df aic flc h100p">
        <h3 marginright="2rem">CORRECT</h3>
        <button class="gray" bgcolor="limegreen" color="white" bold radius="1rem" paddingright="2rem" paddingleft="2rem"
          lineheight="2.5rem" click="hide:#footer_correct" onclicked="enable:*main" bindquery="c:c;p:p"
          setqueryhref="p:++" href="?c={c}&p={p:1}">Continue</button>
      </div>
    </div>

    <div id="footer_wrong" onshow="audio-play:[assets/audio/wrong.mp3];disable:*main"
      bgcolor="indianred" color="white" class="pa l0 t0" width="100%" height="100%" hide>
      <div class="df aic flc h100p">
        <h3 id="wrongtext" marginright="2rem" color="white" animate-key="0;25;50;75;100"
          animate-transform="translateX(0);translateX(-10px);translateX(10px);translateX(-10px);translateX(0)"
          animate-easing="ease-in-out" animate-duration="0.6s" animate-start="#wrongtext">WRONG</h3>
        <button bgcolor="orangered" color="white" bold radius="1rem" paddingright="2rem" paddingleft="2rem"
          lineheight="2.5rem" click="hide:#footer_wrong" onclicked="enable:*main" bindquery="c:c;p:p"
          setqueryhref="p:++" href="?c={c}&p={p:1}">Continue</button>
      </div>
    </div>

    <div id="footer_complete" onshow="audio-play:[assets/audio/complete.wav]" bgcolor="white" color="white"
      class="pa l0 t0" width="100%" height="100%" hide>
      <div class="df aic flc h100p">
        <button id="btn_review" radius="1rem" bold color="black" paddingright="2rem" paddingleft="2rem"
          lineheight="2.5rem" marginright="2rem"
          click="show:#review;hide:#complete;hide:#btn_review">Review</button>
        <a bgcolor="limegreen" color="white" bold radius="1rem" paddingright="2rem" paddingleft="2rem"
          lineheight="2.5rem" href="map.html">Continue</a>
      </div>
    </div>
  </footer>
</template>
