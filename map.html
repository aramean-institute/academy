<script src="https://cdn.front.nu/nightly/front.js"></script>
<template srcdoc="../index" src="../_templates/map"></template>
<title globalize-get>Browse</title>
<section class="wc_xl" iterate="1;9;i">
  <canvas
    relative
    marginbottom="-2500px"
    id="canvas{i}"
    mapbindvar="canvasgradstops:s{i}"
    canvas-target="#canvas{i}"
    canvas-grad
    canvas-grad-orientation="vertical"
    canvas-grad-stops="{canvasgradstops}"
    canvas-rec="0,50,3000,2500"
    canvas-lines="0,200,300,230,20,white;300,230,490,240,20,white;480,230,690,240,20,white"
    class="br1"
    width="100%"
    height="2500px"
    zindex="-1">
  </canvas>
  <header
    id="categories"
    class="shade1"
    width="100%"
    top="0"
    style="position: sticky"
    mapbindvar="canvasgradstops:s{i};sectioncolor:s{i};sectionicon:s{i}"
    bindasset="apikey:api.api_key;endpoint:api.words.endpoint"
    globalize-onsetload="rerun"
    radius="0 0 1rem 1rem"
    color="white"
    bgcolor="{sectioncolor}"
    >
      <figure flex flexdirection="column" padding="1rem" width="100%">
        <small flex="1" bindglobal="l:globalize.code" data-get="word.{l}" uppercase bold>Section {i}</small>
        <small flex="1" class="z08">0/10 completed</small>
      </figure>
  </header>

  <div
    bindasset="apikey:api.api_key;endpoint:api.words.endpoint"
    data-src="{endpoint}&column=id,word&where=taxonomy.eq(null),id.neq(0)"
    data-header="apikey:{apikey}"
    data-iterate="true"
    data-ttl="90000"
    globalize-onsetload="rerun"
    >
    <a
      flex
      alignitems="center"
      data-set="id:id"
      href="./learn.html?c={id}"
      mapmargin="{id}"
      >
      <div
        width="3rem"
        height="3rem"
        radius="50%"
        bgcolor="white"
        mapbindvar="sectioncolor:s{i}"
        border="2px solid {sectioncolor}"
        color="{sectioncolor}"
        class="shade2"
        flex
        justifycontent="center"
        alignitems="center"
        animate-key="0;50;100"
        animate-transform="scale(1);scale(1.1);scale(1)"
        animate-easing="ease-in-out"
        animate-duration="1s"
        animate-iteration="infinite"
        mouseover="animate-start"
        mouseout="animate-stop">
      </div>
      <small bindglobal="l:globalize.code" data-get="word.{l}" fontsize="75%" lineheight="1.2" uppercase bold paddingleft="0.75rem" color="white" textshadow="0 1px 3px rgba(0,0,0,.8)"></small>
    </a>
  </div>
  <hr>
  <hr class="shade1">
</section>
